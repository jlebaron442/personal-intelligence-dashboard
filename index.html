<!DOCTYPE html>
<html>
<head>
<title>Personal Intelligence Dashboard</title>
<style>
@import url('https://fonts.cdnfonts.com/css/satoshi');

body{
  background-image: url('IMG_4433.jpeg');
  background-size: cover; background-position: center; background-attachment: fixed;
  margin:40px;
  font-family:'Satoshi',sans-serif;
  color:#222;
}
h1{ margin-bottom:5px; color:white; font-size:3rem; 
}
.box{
  background:rgba(255,255,255,0.50);
  backdrop-filter: blur(4px);
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}
.hero-card{
  background:rgba(255,255,255,0.50);
  backdrop-filter:blur(4px);
  border-radius:10px;
  overflow:hidden;
}

.hero-card img{
  width:100%;
  height:300px;
  object-fit:cover;
}

.hero-content{
  padding:20px;
}
</style>
</head>
<body>

<h1>Personal Intelligence Dashboard</h1>
<p style="color:white;">Calm. Curious. Intentional.</p>

<div id="content"></div>

<script>
fetch("content.json")
  .then(res => res.json())
  .then(data => {
    const featured = data.find(item => item.type === "Featured");

    document.getElementById("content").innerHTML = `
      <section class="hero-card">
        <img src="${featured.image}" alt="${featured.title}">
        <div class="hero-content">
          <div class="category">${featured.category}</div>
          <h2>${featured.title}</h2>
          <p>${featured.summary}</p>
          <div class="meta">
            ${featured.author} • ${featured.source} • ${featured.readTime}
          </div>
      </div>
      </section>
    `;
  });
</script>


</body>
</html>

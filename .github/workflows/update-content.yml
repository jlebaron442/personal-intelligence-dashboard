name: Update Content

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"
  push:
    paths:
      - decisions.json

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
      - name: Run script
        run: python update_content.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add candidates.json content.json decisions.json
          git commit -m "Update content" || echo "No changes"
          git push

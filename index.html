<div class="hero-card">
  <a href="${featured.url}" target="_blank">
    <img src="${featured.image}" alt="${featured.title}">
  </a>

  <div class="hero-content">
    <h2>
      <a href="${featured.url}"
         target="_blank"
         style="color:#222;text-decoration:none;">
        ${featured.title}
      </a>
    </h2>

    <p>${featured.summary}</p>

    <small>${featured.source} • ${featured.readTime}</small>
  </div>
</div>

<div class="grid">
  ${articles.map(item => `
    <div class="box">
      <img src="${item.image}"
           alt="${item.title}"
           style="width:100%;height:200px;object-fit:cover;border-radius:8px;">

      <h3>
        <a href="${item.url}"
           target="_blank"
           style="color:#222;text-decoration:none;">
          ${item.title}
        </a>
      </h3>

      <p>${item.summary}</p>

      <small>
        ${item.author}<br>
        ${item.source} • ${item.readTime}
      </small>
    </div>
  `).join("")}
</div>

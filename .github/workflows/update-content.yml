name: Update Content

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
      - name: Run script
        run: python update_content.py
      - name: Commit candidates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add candidates.json
          git commit -m "Update candidates" || echo "No changes"
          git push
        

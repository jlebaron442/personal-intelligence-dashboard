<!DOCTYPE html>
<html>
<head>
<title>Personal Intelligence Dashboard</title>
<style>
@import url('https://fonts.cdnfonts.com/css/satoshi');
body{
  background-image: url('IMG_4433.jpeg');
  background-size: 100% auto; background-position: center; background-attachment: fixed;
  margin:40px;
  font-family:'Satoshi',sans-serif;
  color:#222;
}
h1{ margin-bottom:5px; color:white; font-size:3rem; 
}
.box{
  background:rgba(255,255,255,0.50);
  backdrop-filter: blur(4px);
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}
</style>
</head>
<body>

<h1>Personal Intelligence Dashboard</h1>
<p style="color:white;">Calm. Curious. Intentional.</p>

<div class="box">
<h2>Today's Insight</h2>
<p style="color:white;>Curiosity is one of the purest forms of respect.</p>
</div>

<div class="box">
<h2>Worth Your Time</h2>
<p>David Brooks: How to Know a Person</p>
</div>

<div class="grid">

<div class="box">
<h2>Family</h2>
<p>Gottman</p>
<p>Jefferson Fisher</p>
</div>

<div class="box">
<h2>Mental Models</h2>
<p>Gary Klein</p>
<p>Premortem</p>
</div>

<div class="box">
<h2>Strategy</h2>
<p>McKinsey</p>
<p>MIT Sloan</p>
</div>

<div class="box">
<h2>Engineering</h2>
<p>IEEE Spectrum</p>
<p>INCOSE</p>
</div>

</div>

</body>
</html>

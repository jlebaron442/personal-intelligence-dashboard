<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>The Long View</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.cdnfonts.com/css/satoshi');

body{
  background-image: url('IMG_4433.jpeg');
  background-size: cover; background-position: center; background-attachment: fixed;
  margin:40px;
  font-family:'Satoshi',sans-serif;
  color:#222;
}
h1{ margin-bottom:5px; color:#1f2a33; font-size:3rem; }
.box{
  background:rgba(255,255,255,0.50);
  backdrop-filter: blur(4px);
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
}
.box img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:8px;
}
.box h3 a{
  color:#222;
  text-decoration:none;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}
.hero-card{
  background:rgba(255,255,255,0.50);
  backdrop-filter:blur(4px);
  border-radius:10px;
  overflow:hidden;
  margin-bottom: 20px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
}
.hero-card img{
  width:100%;
  height:300px;
  object-fit:cover;
}
.hero-content{
  padding:20px;
}
.hero-content h2{
  font-size:2rem;
  margin-top:0;
  margin-bottom:10px;
}
.hero-content h2 a{
  color:#222;
  text-decoration:none;
}
h3 {
  font-size: 1.5rem;
  margin-bottom: 8px;
}
p {
  line-height: 1.6;
}
small {
  color: #666;
}
@media (max-width:700px){
  body{ margin:16px; }
  h1{ font-size:2.2rem; }
  .grid{ grid-template-columns:1fr; }
  .hero-card img{ height:200px; }
}
</style>
</head>
<body>

<h1>The Long View</h1>
<p style="color:#1f2a33;">Calm. Curious. Intentional.</p>

<div id="content"></div>

<script>
const MAX_CARDS = 12;

  const FALLBACK = {
  "Mental Models": "images/map-territory.jpg",
  "Family": "images/gottman-conversation.jpg",
  "Strategy": "images/engineering-strategy.jpg",
  "Engineering": "images/medical-device-future.jpg",
  "Norway & Ideas": "images/bergen-winter.jpg"
};
const imgFor = item => item.image || FALLBACK[item.category] || "";
  
// Join non-empty values with a separator
const meta = (...parts) => parts.filter(Boolean).join(" • ");

fetch("content.json?" + Date.now())
  .then(res => res.json())
  .then(data => {
    const featured = data.find(item => item.featured) || data[0];
    // Newest first within each category, then take turns across categories
    const byCat = {};
    data.filter(item => item !== featured)
        .sort((a, b) => (b.dateAdded || "").localeCompare(a.dateAdded || ""))
        .forEach(item => (byCat[item.category || "Other"] ||= []).push(item));
    const queues = Object.values(byCat).sort(() => Math.random() - 0.5);
    const articles = [];
    while (articles.length < MAX_CARDS && queues.some(q => q.length))
      queues.forEach(q => q.length && articles.length < MAX_CARDS && articles.push(q.shift()));

    document.getElementById("content").innerHTML = `
      <div class="hero-card">
        ${featured.image ? `<img src="${featured.image}" alt="${featured.title}">` : ""}
        <div class="hero-content">
          <h2><a href="${featured.url}" target="_blank">${featured.title}</a></h2>
          ${featured.summary ? `<p>${featured.summary}</p>` : ""}
          <small>${meta(featured.source, featured.readTime)}</small>
        </div>
      </div>
      <div class="grid">
        ${articles.map(item => `
          <div class="box">
            ${imgFor(item) ? `<img src="${imgFor(item)}" alt="${item.title}" onerror="this.onerror=null;this.src='${FALLBACK[item.category] || ""}'">` : ""}
            <h3><a href="${item.url}" target="_blank">${item.title}</a></h3>
            ${item.summary ? `<p>${item.summary}</p>` : ""}
            <small>
              ${item.author ? item.author + "<br>" : ""}
              ${meta(item.category, item.source, item.readTime)}
            </small>
          </div>
        `).join("")}
      </div>
    `;
  });
</script>

</body>
</html>

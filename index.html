<!DOCTYPE html>
<html>
<head>
<title>The Long View</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.cdnfonts.com/css/satoshi');

body{
  background-image: url('IMG_4433.jpeg');
  background-size: cover; background-position: center; background-attachment: fixed;
  margin:40px;
  font-family:'Satoshi',sans-serif;
  color:#222;
}
h1{ margin-bottom:5px; color:white; font-size:3rem; 
}
.box{
  background:rgba(255,255,255,0.50);
  backdrop-filter: blur(4px);
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}
.hero-card{
  background:rgba(255,255,255,0.50);
  backdrop-filter:blur(4px);
  border-radius:10px;
  overflow:hidden;
  margin-bottom: 20px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
}

.hero-card img{
  width:100%;
  height:300px;
  object-fit:cover;
}

.hero-content{
  padding:20px;
}

.hero-content h2 a{
  color:#222;
  text-decoration:none;
}
  
h3 {
  font-size: 1.5rem;
  margin-bottom: 8px;
}

p {
  line-height: 1.6;
}

small {
  color: #666;
}
@media (max-width:700px){
  body{ margin:16px; }
  h1{ font-size:2.2rem; }
  .grid{ grid-template-columns:1fr; }
  .hero-card img{ height:200px; }
}
</style>
</head>
<body>

<h1>The Long View</h1>
<p style="color:white;">Calm. Curious. Intentional.</p>

<div id="content"></div>

<script>
fetch("content.json")
  .then(res => res.json())
.then(data => {
  const featured = data.find(item => item.featured) || data[0];
  const articles = data.filter(item => item !== featured);
    document.getElementById("content").innerHTML = `
      <div class="hero-card">
        <img src="${featured.image}" alt="${featured.title}">
      <div class="hero-content">
      <h2>
        <a href="${featured.url}" target="_blank">
          ${featured.title}
        </a>
      </h2>
        <p>${featured.summary}</p>
        <small>${featured.source} • ${featured.readTime}</small>
      </div>
      </div>
      <div class="grid">
       ${articles.map(item => `
          <div class="box">
            <img src="${item.image}"
                 alt="${item.title}"
                 style="width:100%;height:200px;object-fit:cover;border-radius:8px;">

            <h3>
              <a href="${item.url}"
                 target="_blank"
                 style="color:#222;text-decoration:none;">
                ${item.title}
              </a>
            </h3>

            <p>${item.summary}</p>

            <small>
              ${item.author}<br>
              ${item.source} • ${item.readTime}
            </small>
          </div>
        `).join("")}
      </div>
    `;
  });
</script>


</body>
</html>
